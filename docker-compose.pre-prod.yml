services:
    database:
        image: mariadb:10.11
        environment:
            MARIADB_USER: ${DATABASE_USER}
            MARIADB_PASSWORD: ${DATABASE_PASSWORD}
            MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
        volumes:
            - database-pre-prod:/var/lib/mysql
            - ./sql/import.sql:/docker-entrypoint-initdb.d/import.sql
        networks:
            - bloc5-pre-prod-network
    app:
        build:
            context: .
            dockerfile: Dockerfile
            target: prod
        volumes:
            - ./000-default.conf:/etc/apache2/sites-available/000-default.conf
        ports:
            -   40001:80
        networks:
            - bloc5-pre-prod-network
        environment:
            - DATABASE_HOST=database
            - DATABASE_NAME=videgrenierenligne
            - DATABASE_USER=${DATABASE_USER}
            - DATABASE_PASSWORD=${DATABASE_PASSWORD}
        depends_on:
            - database
    phpmyadmin:
        image: phpmyadmin:latest
        environment:
            - PMA_HOST=database
            - PMA_PORT=3306
            - PMA_USER=root
            - PMA_PASSWORD=${MARIADB_ROOT_PASSWORD}
            - UPLOAD_LIMIT=300M
        ports:
            - 2026:80
        networks:
            - bloc5-pre-prod-network
        depends_on:
            - database
networks:
    bloc5-pre-prod-network:
        driver: bridge

volumes:
    database-pre-prod:
        driver: local
