{% extends "base.html" %}

{% block title %}Connexion{% endblock %}

{% block body %}

<style>
  @media (min-width: 768px) {
    .login-wrapper {
      max-width: 1140px;
      margin: 0 auto;
      display: flex;
      flex-wrap: nowrap;
      overflow: hidden;
    }

    .login-wrapper .image-col {
      flex: 1;
      display: block;
      background: url('/images/login.jpg') center/cover no-repeat;
      min-height: 100%;
      position: relative;
    }

    .login-wrapper .form-col {
      flex: 1;
      padding: 3rem;
    }

    .banner-text {
      position: absolute;
      top: 20%;
      left: 10%;
      z-index: 2;
      color: white;
    }
  }

  @media (max-width: 767px) {
    .login-wrapper {
      display: block;
      box-shadow: none;
      border-radius: 0;
    }

    .image-col {
      display: none !important;
    }

    .form-col {
      padding: 2rem 1rem;
    }

    .btn-cv1 {
      width: 100%;
    }
  }
</style>

<div class="container-fluid bg-image py-5">
  <div class="login-wrapper">

    <!-- Image (cachée sur mobile) -->
    <div class="image-col d-none d-md-block">
      <div class="banner-text">
        <div class="line mb-2"></div>
        <h4 class="b-text">
          Des <span class="color-active">centaines<br></span>
          <span class="color-b1">d'articles vous</span> attendent
        </h4>
      </div>
    </div>

    <!-- Formulaire -->
    <div class="form-col">
      <h3 class="mb-4 text-center">Connexion</h3>

      <form action="" method="post">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="sample@gmail.com" required>
          </div>

          <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="**********" required>
          </div>

          <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" id="remember" name="remember">
            <label class="form-check-label" for="remember">
              Se souvenir de moi
            </label>
            <div class="small text-muted">
              (non recommandé si vous êtes sur un ordinateur partagé)
            </div>
          </div>

          <div class="d-flex flex-column flex-md-row align-items-center justify-content-between mb-3">
            <button type="submit" name="submit" class="btn btn-cv1 mb-2 mb-md-0">Connexion</button>
            <span class="mx-md-3 d-none d-md-block">ou</span>
            <a href="/register" class="btn btn-link">Inscription</a>
          </div>

          <div class="text-center">
            <a href="#" class="text-muted">Mot de passe oublié ?</a>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>
{% endblock %}
