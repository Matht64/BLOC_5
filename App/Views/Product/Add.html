{% extends "base.html" %}

{% block title %}Produit{% endblock %}

{% block body %}
<div class="content-wrapper upload-page edit-page">

    <!-- channel -->
    <div class="container-fluid add-header">
        <div class="row">
            <h1>
                Que souhaitez-vous donner ?
            </h1>
        </div>
    </div>
    <!-- ///channel -->

    <div class="container mt-30">
        <form action="" method="post" enctype="multipart/form-data">
            <div class="row">
                <div class="col-lg-6">
                    <div class="u-form">
                        <div class="row">
                            <div class="col-lg-12">
                                <div class="form-group">
                                    <label for="title">Titre</label>
                                    <input type="text" name="title" class="form-control" id="title"
                                           placeholder="Jeu de cartes (rare)" required="true">
                                </div>
                            </div>
                            <div class="col-lg-12">
                                <div class="form-group">
                                    <label for="description">Description</label>
                                    <textarea class="form-control" name="description" id="description" rows="3" required="true"></textarea>
                                </div>
                            </div>

                            <div class="col-lg-12">
                                <div class="form-group">
                                    <label for="city">Ville</label>
                                    <input id="city" class="form-control cityAutoComplete" name="city" type="text" placeholder="" required="true"/>
                                </div>
                            </div>

                            <div class="col-lg-12">
                                <div class="form-group">
                                    <label for="picture">Image</label>
                                    <input type="file" class="form-control" name="picture" id="picture" rows="3" required="false"/>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="u-area mt-small">
                            <button type="submit" name="submit" class="btn btn-primary u-btn">Valider</button>
                    </div>
                    <div class="u-terms">
                        <p>En soumettant votre article vous acceptez les <a href="#">conditions générales</a> de Vide Grenier en ligne.</p>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock body %}

{% block javascript %}
    <script type="text/javascript">
        $('.cityAutoComplete').autoComplete({
            resolver: 'custom',
            events: {
                search: function (qry, callback) {
                    // let's do a custom ajax call
                    $.ajax(
                        '/api/cities',
                        {
                            data: { 'query': qry}
                        }
                    ).done(function (res) {
                        callback(res)
                    });
                }
            }
        });
    </script>
{% endblock %}
