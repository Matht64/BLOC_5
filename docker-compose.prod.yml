services:
    database:
        volumes:
            - database:/var/lib/mysql
    app:
        image: localhost:5000/videgrenierenligne:latest
        ports:
            -   40002:80
        depends_on:
            - database
    phpmyadmin:
        ports:
            - 2027:80
        depends_on:
            - database
volumes:
    database:
        driver: local
