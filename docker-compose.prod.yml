services:
    database:
        volumes:
            - database:/var/lib/mysql
    app:
        build:
            context: .
            additional_contexts:
                source: https://github.com/Matht64/bloc_5.git#main
        ports:
            -   40002:80
        depends_on:
            - database
    phpmyadmin:
        ports:
            - 2027:80
        depends_on:
            - database
volumes:
    database:
        driver: local
