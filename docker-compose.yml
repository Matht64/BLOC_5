services:
    database:
        image: mariadb:10.11
        environment:
            MARIADB_USER: ${DATABASE_USER}
            MARIADB_PASSWORD: ${DATABASE_PASSWORD}
            MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
        volumes:
            - ./database:/var/lib/mysql
        networks:
            - bloc5-network
    app:
        build: .
        volumes:
            - ./:/var/www/html
            - ./000-default.conf:/etc/apache2/sites-available/000-default.conf
        ports:
            -   40000:80
        networks:
            - bloc5-network
        environment:
            - DATABASE_HOST=database
            - DATABASE_NAME=videgrenierenligne
            - DATABASE_USER=${DATABASE_USER}
            - DATABASE_PASSWORD=${DATABASE_PASSWORD}
        command: sh -c "composer install --no-dev --no-scripts --optimize-autoloader \
                        && npm install --no-audit --no-fund --omit=dev \
                        && npm run build \
                        && apache2-foreground"
        depends_on:
            - database
    phpmyadmin:
        image: phpmyadmin:latest
        environment:
            - PMA_HOST=database
            - PMA_PORT=3306
            - PMA_USER=root
            - PMA_PASSWORD=${MARIADB_ROOT_PASSWORD}
            - UPLOAD_LIMIT=300M
        ports:
            - 2025:80
        networks:
            - bloc5-network
        depends_on:
            - database

networks:
    bloc5-network:
        driver: bridge